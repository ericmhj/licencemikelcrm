spring:
  datasource:
    # Testcontainers will override these via @DynamicPropertySource
    url: jdbc:tc:postgresql:16:///license_test_db
    username: test_user
    password: test_pass
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 10000

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    clean-disabled: false

# Test RSA public key (2048-bit, for test purposes only)
license-service:
  jwt:
    public-key: ""
    max-ttl-minutes: 15

logging:
  level:
    com.mikelcrm.licenseservice: INFO
    org.testcontainers: INFO
