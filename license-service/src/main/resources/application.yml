server:
  port: 8080

spring:
  application:
    name: license-service

  # PostgreSQL DataSource with HikariCP
  datasource:
    url: jdbc:postgresql://localhost:5432/license_db
    username: license_user
    password: license_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LicenseServicePool

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Mail (Hostinger SMTP)
  mail:
    host: ${MAIL_HOST:smtp.hostinger.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:admin@normalia.com.mx}
    password: ${MAIL_PASSWORD:TU_CONTRASEÑA_AQUI}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.hostinger.com

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:license_redis_dev}
      timeout: 2000ms

  # Kafka
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: license-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        isolation.level: read_committed

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: com.fasterxml.jackson.databind.util.ISO8601DateFormat

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Application-specific configuration
license-service:
  jwt:
    public-key: "${JWT_PUBLIC_KEY:}"
    max-ttl-minutes: 15
    issuer: auth-service
    # Set to true to disable JWT validation in development (when no auth-service is available)
    skip-validation: "${JWT_SKIP_VALIDATION:false}"
    # Confía en los headers inyectados por el gateway (X-Consumer-Id, X-Gateway-Secret).
    # Requerido para llamadas servicio-a-servicio (p.ej. cobro variable desde SMT).
    trust-gateway-headers: "${LICENSE_SERVICE_JWT_TRUST_GATEWAY_HEADERS:false}"
    # Keycloak JWKS endpoint for validating Keycloak-issued tokens
    keycloak-jwks-url: "${KEYCLOAK_JWKS_URL:http://localhost:8180/realms/mikel-crm/protocol/openid-connect/certs}"
  payment:
    active-gateway: DUMMY
  stripe:
    api-key: "${STRIPE_API_KEY:sk_test_placeholder}"
    webhook-secret: "${STRIPE_WEBHOOK_SECRET:whsec_placeholder}"
    currency: mxn
    publishable-key: "${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}"
  rate-limit:
    query-max-requests-per-second: 1000
    command-max-requests-per-second: 100
    window-size-seconds: 1
  redis:
    cache-ttl-seconds: 300
  kafka:
    topic: license-events
  outbox:
    # Intervalo del relay del transactional outbox hacia Kafka.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
