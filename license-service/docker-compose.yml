services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: license-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/license_db
      SPRING_DATASOURCE_USERNAME: license_user
      SPRING_DATASOURCE_PASSWORD: license_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: license-kafka:9092
      LICENSE_SERVICE_JWT_TRUST_GATEWAY_HEADERS: "true"
      MAIL_HOST: smtp.hostinger.com
      MAIL_PORT: 465
      MAIL_USERNAME: admin@normalia.com.mx
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - license-network
      - mikel-net
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: license-postgres
    environment:
      POSTGRES_DB: license_db
      POSTGRES_USER: license_user
      POSTGRES_PASSWORD: license_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license_user -d license_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - license-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: license-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - license-network
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    container_name: license-kafka
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://license-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 8
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    networks:
      - license-network
      - mikel-net
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: license-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creando topics de Kafka..."
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server license-kafka:9092 --create --if-not-exists --topic tenant.lifecycle --partitions 4 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server license-kafka:9092 --create --if-not-exists --topic license.events --partitions 4 --replication-factor 1
        echo "Topics creados:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server license-kafka:9092 --list
    networks:
      - license-network
      - mikel-net
    restart: "no"

  mailhog:
    image: mailhog/mailhog
    container_name: license-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - license-network
    restart: unless-stopped

  portal:
    build:
      context: ../portal-contratacion
      dockerfile: Dockerfile
    container_name: license-portal
    ports:
      - "4200:4200"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - license-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  license-network:
    driver: bridge
  mikel-net:
    name: mikel-net
    external: true
