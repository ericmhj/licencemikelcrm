# =============================================================================
# Portal Contratación — Compose de DESARROLLO STANDALONE
# =============================================================================
# IMPORTANTE: El portal ya está definido en el compose principal:
#   c:\dev\licencesmikel\license-service\docker-compose.yml (servicio: portal)
#
# Este archivo solo es útil para desarrollo aislado del frontend SIN backend.
# Para el stack completo, usa:
#   cd c:\dev\licencesmikel\license-service
#   docker compose up -d --build
#
# Si necesitas levantar SOLO el portal (backend ya corriendo por separado):
#   docker compose up -d --build
# =============================================================================

services:
  portal:
    build: .
    container_name: portal-contratacion
    ports:
      - "4200:4200"
    networks:
      - license-network

networks:
  license-network:
    name: license-service_license-network
    external: true
